name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: acdonaire/apertus-8b

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          # NOTA: NO generamos etiqueta "latest" porque Verda no la acepta
          # Usa siempre etiquetas versionadas (v1.0, v1.1, etc.)

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

# NOTA: Para usar este workflow necesitas configurar estos secrets en GitHub:
# - DOCKER_USERNAME: tu usuario de Docker Hub
# - DOCKER_PASSWORD: tu token de acceso de Docker Hub
#
# Cómo configurar:
# 1. Ve a Settings > Secrets and variables > Actions
# 2. Añade DOCKER_USERNAME y DOCKER_PASSWORD
# 3. Para crear versiones, usa git tags:
#    git tag v1.0
#    git push origin v1.0
# 4. Esto construirá y publicará automáticamente la versión v1.0
#
# IMPORTANTE: Este workflow NO genera etiqueta "latest" porque Verda no la acepta.
# Siempre usa etiquetas versionadas (v1.0, v1.1, v2.0, etc.)
