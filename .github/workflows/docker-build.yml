name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          # NOTA: NO generamos etiqueta "latest" porque Verda no la acepta
          # Usa siempre etiquetas versionadas (v1.0, v1.1, etc.)

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

# NOTA: Este workflow usa GitHub Container Registry (ghcr.io)
# No necesitas configurar secrets adicionales - usa el GITHUB_TOKEN automático
#
# Para crear versiones, usa git tags:
#    git tag v1.0
#    git push origin v1.0
# 
# Esto construirá y publicará automáticamente en:
#    ghcr.io/acdonaire/apertus:v1.0
#
# Para usar esta imagen en Verda:
#    Imagen: ghcr.io/acdonaire/apertus:v1.0
#
# IMPORTANTE: Este workflow NO genera etiqueta "latest" porque Verda no la acepta.
# Siempre usa etiquetas versionadas (v1.0, v1.1, v2.0, etc.)
